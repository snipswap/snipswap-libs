[package]
name = "snipswap-libs"
version = "0.1.0"
edition = "2021"
description = "Shared types and utilities"
license = "GPL-3.0"
repository = "https://github.com/snipswap/snipswap-libs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.1"
chacha20poly1305 = "0.10"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
