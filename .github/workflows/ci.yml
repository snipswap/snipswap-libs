name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Check dependencies weekly (Monday 9 AM UTC)
    - cron: '0 9 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Detect what needs to be checked
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      typescript: ${{ steps.detect.outputs.typescript }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect project types
        id: detect
        run: |
          echo "rust=$([ -f Cargo.toml ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "typescript=$([ -f package.json ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "python=$([ -f requirements.txt ] || [ -f setup.py ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # Rust build and test
  build-rust:
    name: Build and Test (Rust)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (stable)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy linter
        run: cargo clippy --all --all-features -- -D warnings

      - name: Build all targets
        run: cargo build --all --all-features --verbose

      - name: Run tests
        run: cargo test --all --all-features --verbose

  # TypeScript/Node.js build and test
  build-typescript:
    name: Build and Test (TypeScript)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.typescript == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check || true

      - name: Run linter
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test || true

  # Check Rust dependencies
  check-rust-deps:
    name: Check Rust Dependencies
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Check outdated Rust dependencies
        run: cargo outdated --format list
        continue-on-error: true

      - name: Run cargo audit (security)
        uses: rustsec/audit-check@v1
        continue-on-error: true

  # Check TypeScript/Node.js dependencies
  check-npm-deps:
    name: Check npm Dependencies
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.typescript == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check outdated npm packages
        run: npm outdated || true

      - name: Run npm audit (security)
        run: npm audit || true
        continue-on-error: true

  # Security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [check-rust-deps, check-npm-deps]
    if: always()
    
    steps:
      - name: Report security status
        run: |
          echo "🔍 Security Check Summary"
          echo "========================"
          echo "✅ Rust Security Audit: Completed"
          echo "✅ npm Security Audit: Completed"
          echo ""
          echo "Review logs above for vulnerabilities"
